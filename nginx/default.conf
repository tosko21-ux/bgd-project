server {
    listen       80;
    listen  [::]:80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # Clean URLs: /about → /about.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Custom 404 page
    error_page  404  /404.html;
    location = /404.html {
        internal;
    }

    # HTML: nikdy necachovat (vzdy stiahnut cerstve)
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # JS, CSS, JSON: 1h cache, vzdy revalidovat
    location ~* \.(css|js|json)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Obrazky a fonty: dlha cache (menia sa zriedka)
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
}